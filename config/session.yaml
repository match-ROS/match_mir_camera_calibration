# Measured marker lengths and height are prefilled; remaining physical values are blank.
# All lengths are metres; marker length includes the black frame, not the white margin.
target_robot: mur620a
observer_robot: mur620d
acquisition_mode: manual  # Joystick driving; the recorder never publishes cmd_vel.
preview_rotate_ccw: true  # MiR floor RGB cameras are mounted sideways.
dictionary: DICT_APRILTAG_36h11  # Confirmed from the live images of the current markers.
robust_detection: true  # Known-ID recovery (max. two code-bit errors), scale/contrast fallback.
markers:
  front_left: {id: 24, length_m: 0.16}
  front_right: {id: 7, length_m: 0.16}
# Front marker centre measured 0.44 m above the floor. In the MuR620 URDF,
# base_footprint -> base_link is identity, so the base_link height is also 0.44 m.
height_anchor: {marker: front_left, z_m: 0.44}
# Automatic driving only: outer FREE rectangle in Qualisys 'mocap' coordinates.
# Optional for manual acquisition; the joystick operator controls the driving.
bounds: {x_min: null, x_max: null, y_min: null, y_max: null}
# Automatic driving: circumradii about base_link, including robot/stowed arms.
target_radius_m: null
observer_radius_m: null
margin_m: 0.20
grid: {nx: 3, ny: 3, yaw_offsets_deg: [-20.0, 0.0, 20.0]}
planner_resolution_m: 0.10
max_linear_mps: 0.05
max_angular_rps: 0.10
linear_acceleration_mps2: 0.05
angular_acceleration_rps2: 0.10
reaction_time_sec: 0.50
mocap_timeout_sec: 0.20
heartbeat_timeout_sec: 0.75
image_max_age_sec: 1.0
settle_sec: 2.0
still_translation_m: 0.003
still_rotation_deg: 0.3
position_tolerance_m: 0.015
yaw_tolerance_deg: 1.0
observer_translation_tolerance_m: 0.015
observer_rotation_tolerance_deg: 1.0
frames_per_camera: 5
capture_timeout_sec: 15.0
segment_timeout_sec: 180.0
motion_enabled: false
boundary_verified: false
exclusive_control_confirmed: false
arms_stowed_confirmed: false
output_dir: ~/mir_camera_calibration_sessions
# Optional initial guesses, ONLY used by the offline solver. Prefer live TF.
# Each transform is [x,y,z,qx,qy,qz,qw], base_link -> camera optical frame.
camera_initial_guesses: {}
